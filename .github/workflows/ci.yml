name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.25"
      - run: uv sync --locked --python 3.12 --no-editable
      - run: uv run --locked --no-editable ruff check .
      - run: uv run --locked --no-editable ruff format --check .
      - run: uv run --locked --no-editable pytest -q
      - run: uv run --locked --no-editable data-final demo --output reports/runs/ci
      - run: uv run --locked --no-editable data-final analyze-legacy data/reference/legacy_panel.csv --output reports/runs/legacy-ci
      - uses: actions/upload-artifact@v4
        with:
          name: analysis-reports
          path: reports/runs/
